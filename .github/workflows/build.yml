name: build-and-push

on:
  push:
    branches: [ "main" ]
  schedule:
    # Weekly: Mondays at 09:17 UTC
    # Rebuild for uv/Python base image updates, Debian + GDAL + security patches
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write # lets the keepalive step re-enable the schedule

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # org/repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (optional, for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=3.13-bookworm
            type=raw,value=3.13-bookworm-{{date 'YYYYMMDD'}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Always re-pull the base image, and skip the layer cache on scheduled
          # runs so the apt-get layer actually picks up new package versions.
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          # If you don't care about ARM, remove platforms for faster builds.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # GitHub disables scheduled workflows after 60 days without repo activity.
      - name: Keep schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable build.yml --repo "$GITHUB_REPOSITORY"
